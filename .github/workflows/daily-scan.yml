name: 每日扫描并部署

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      cnPmi:
        description: "A股 制造业PMI(荣枯线50,来源:统计局)。留空=沿用上次"
        required: false
        type: string
      cnPpi:
        description: "A股 PPI同比%(看正负定通胀,来源:统计局)。留空=沿用上次"
        required: false
        type: string
      cnCpi:
        description: "A股 CPI同比%(仅供点评参考,可留空)"
        required: false
        type: string
      cnNote:
        description: "A股 数据月份备注,如 2026-07(可留空)"
        required: false
        type: string
      usPmi:
        description: "美股 ISM制造业PMI(荣枯线50,来源:ismworld.org)。留空=沿用上次"
        required: false
        type: string
      usPpi:
        description: "美股 PPI同比%(来源:bls.gov)。留空=沿用上次"
        required: false
        type: string
      usCpi:
        description: "美股 CPI同比%(仅供点评参考,可留空)"
        required: false
        type: string
      usNote:
        description: "美股 数据月份备注,如 2026-07(可留空)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stock-radar
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 更新宏观数据(仅手动触发填了表单时生效)
        if: github.event_name == 'workflow_dispatch'
        env:
          CN_PMI: ${{ inputs.cnPmi }}
          CN_PPI: ${{ inputs.cnPpi }}
          CN_CPI: ${{ inputs.cnCpi }}
          CN_NOTE: ${{ inputs.cnNote }}
          US_PMI: ${{ inputs.usPmi }}
          US_PPI: ${{ inputs.usPpi }}
          US_CPI: ${{ inputs.usCpi }}
          US_NOTE: ${{ inputs.usNote }}
        run: npx tsx scripts/set-macro.ts

      - name: 运行每日扫描
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: npm run scan

      - name: 提交历史数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "无数据变更,跳过提交"
          else
            git commit -m "chore(data): 每日榜单归档 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 构建前端
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock-radar/dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
